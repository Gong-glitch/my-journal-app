<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Journal Feed</title>
  <style>
    body { 
      font-family: sans-serif; 
      background-color: #f4f4f4; 
      margin: 0; 
      padding: 20px; 
    }

    .container { 
      max-width: 500px; 
      margin: 0 auto; 
    }

    /* Upload Form */
    .upload-form { 
      background: #fff; 
      padding: 15px; 
      border-radius: 4px; 
      margin-bottom: 40px; 
      box-shadow: 0 2px 5px rgba(0,0,0,0.1); 
    }

    .upload-form h3 {
      margin-top: 0;
      margin-bottom: 12px;
      font-size: 18px;
    }

    .upload-form input, 
    .upload-form textarea { 
      width: 100%; 
      margin-bottom: 10px; 
      padding: 8px; 
      box-sizing: border-box; 
      font-size: 15px;
    }

    .btn-save { 
      width: 100%; 
      padding: 10px; 
      background: #ff8c00; 
      color: white; 
      border: none; 
      cursor: pointer; 
      border-radius: 4px; 
      font-weight: bold;
      font-size: 15px;
    }

    .btn-download {
      width: 100%;
      padding: 10px;
      background: #2196F3;
      color: white;
      border: none;
      cursor: pointer;
      border-radius: 4px;
      font-weight: bold;
      font-size: 15px;
      margin-top: 10px;
    }

    /* Entry Component */
    .entry-card { 
      margin-bottom: 50px; 
      display: flex; 
      flex-direction: column; 
      gap: 15px; 
    }

    /* Header Box: Date & Author (Orange) */
    .entry-header { 
      width: 55%; 
      background-color: #ff8c00; 
      color: #ffffff; 
      padding: 12px 15px; 
      border-radius: 2px; 
      text-align: left; 
      box-sizing: border-box;
    }

    .entry-header .date { 
      font-size: 15px; 
      display: block; 
      margin-bottom: 4px;
    }

    .entry-header .author { 
      font-weight: bold; 
      font-size: 15px; 
    }

    /* Image Container (Light Orange Border) */
    .entry-images-container { 
      width: 100%; 
      height: 280px; 
      background-color: #f0f0f0; 
      border: 4px solid #ffcc80; 
      border-radius: 2px; 
      display: flex; 
      overflow-x: auto; 
      scroll-snap-type: x mandatory; 
      gap: 10px; 
      box-sizing: border-box;
    }

    .entry-images-container img { 
      flex: 0 0 100%; 
      width: 100%; 
      height: 100%; 
      object-fit: cover; 
      scroll-snap-align: start; 
    }

    /* Thoughts Box (Pink) */
    .entry-box-thoughts { 
      width: 100%; 
      height: 180px; 
      background-color: #ff69b4; 
      color: #ffffff; 
      padding: 20px; 
      box-sizing: border-box; 
      border-radius: 2px; 
      text-align: left; 
      font-size: 15px; 
      white-space: pre-line;
      overflow-y: auto;
    }

    /* Lyrics Box (Magenta) */
    .entry-box-lyrics { 
      width: 100%; 
      height: 180px; 
      background-color: #ff00ff; 
      color: #ffffff; 
      padding: 20px; 
      box-sizing: border-box; 
      border-radius: 2px; 
      text-align: left; 
      font-size: 15px; 
      white-space: pre-line;
      overflow-y: auto;
    }

    .delete-btn { 
      background: #e53935; 
      color: white; 
      border: none; 
      padding: 8px 14px; 
      border-radius: 4px; 
      cursor: pointer; 
      width: fit-content; 
      font-size: 13px;
      margin-top: 5px;
    }
  </style>
</head>
<body>

<div class="container">
  <!-- Upload Form -->
  <form id="entryForm" class="upload-form">
    <h3>Add Entry</h3>
    <input type="date" id="customDate" required />
    <input type="text" id="author" placeholder="Author Name" required />
    <input type="file" id="images" multiple accept="image/*" required />
    <textarea id="thoughts" placeholder="Text / Thoughts / Connections" rows="3" required></textarea>
    <textarea id="lyrics" placeholder="Specific Lyrics" rows="3" required></textarea>
    <button type="submit" class="btn-save">Save Entry</button>
    <button type="button" id="downloadBtn" class="btn-download">Download Webpage (.html)</button>
  </form>

  <!-- Container for Feed Entries -->
  <div id="entriesContainer"></div>
</div>

<script src="script.js"></script>
</body>
</html>
